name: Deploy to Cloud Run

on:
  push:
    branches:
      - main  # Deploy เมื่อ push ไป main branch

env:
  PROJECT_ID: gungong-ai
  REGION: asia-southeast1
  SERVICE_NAME: gungong-fullstack

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Build and Push Docker Image
        run: |
          gcloud builds submit \
            --tag gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }} \
            --timeout=30m \
            .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 2 \
            --port 8080 \
            --timeout 300 \
            --max-instances 10 \
            --min-instances 0 \
            --set-env-vars="DEBUG=False,GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }},FIRESTORE_PROJECT_ID=$PROJECT_ID,GEMINI_MODEL=gemini-2.5-flash-lite,LINE_CHANNEL_ACCESS_TOKEN=${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }},LINE_CHANNEL_SECRET=${{ secrets.LINE_CHANNEL_SECRET }}"

      - name: Show Service URL
        run: |
          echo "Deployment successful!"
          gcloud run services describe $SERVICE_NAME --region $REGION --format 'value(status.url)'
