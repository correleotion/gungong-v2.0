# ========================================
# Cloud Build Configuration for GunGong
# Full-Stack Deployment (Frontend + Backend)
# ========================================

steps:
  # 1. Build Docker Image with Frontend + Backend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--no-cache'
      - '-f'
      - 'deployment/Dockerfile.fullstack'
      - '-t'
      - 'gcr.io/$PROJECT_ID/gungong-fullstack:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/gungong-fullstack:latest'
      - '.'
    timeout: 1800s

  # 2. Push Image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/gungong-fullstack:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/gungong-fullstack:latest']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'gungong-fullstack'
      - '--image'
      - 'gcr.io/$PROJECT_ID/gungong-fullstack:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--cpu-boost'
      - '--port'
      - '8080'
      - '--timeout'
      - '300'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'
      - '--set-env-vars'
      - 'DEBUG=False'

images:
  - 'gcr.io/$PROJECT_ID/gungong-fullstack:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/gungong-fullstack:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: 2400s
