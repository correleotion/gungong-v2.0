# ========================================
# Cloud Build Configuration for GunGong
# Full-Stack Deployment (Frontend + Backend)
# ========================================

steps:
  # 1. Build Docker Image with Frontend + Backend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'deployment/Dockerfile.fullstack'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/gungong/gungong-fullstack:$BUILD_ID'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/gungong/gungong-fullstack:latest'
      - '.'
    timeout: 1800s

  # 2. Push Docker Image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/gungong/gungong-fullstack'

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'gungong-fullstack'
      - '--image'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/gungong/gungong-fullstack:latest'
      - '--region'
      - 'asia-southeast1'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--cpu-boost'
      - '--port'
      - '8080'
      - '--timeout'
      - '300'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'
      - '--set-env-vars'
      - 'DEBUG=False,GOOGLE_API_KEY=${_GOOGLE_API_KEY},FIRESTORE_PROJECT_ID=$PROJECT_ID,GEMINI_MODEL=gemini-2.5-flash-lite,LINE_CHANNEL_ACCESS_TOKEN=${_LINE_CHANNEL_ACCESS_TOKEN},LINE_CHANNEL_SECRET=${_LINE_CHANNEL_SECRET}'

images:
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/gungong/gungong-fullstack:$BUILD_ID'
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/gungong/gungong-fullstack:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: 2400s
