services:
  # GunGong Fraud Detection Bot
  gungong-bot:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: gungong-fraud-bot
    image: gungong-fraud-bot:latest

    # Port mapping
    ports:
      - "${PORT:-8000}:8000"

    # Environment variables from .env file
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash-lite}
      - LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN}
      - LINE_CHANNEL_SECRET=${LINE_CHANNEL_SECRET}
      - APP_NAME=${APP_NAME:-GunGong Fraud Detection Bot}
      - DEBUG=${DEBUG:-False}
      - HOST=0.0.0.0
      - PORT=8000
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      # Point to the file inside the mounted secrets directory
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/service-account.json
      - FIRESTORE_PROJECT_ID=${FIRESTORE_PROJECT_ID}
      - USE_FIREBASE_EMULATOR=${USE_FIREBASE_EMULATOR:-false}

    # Load .env file (from root directory)
    env_file:
      - ../.env.yaml

    # Restart policy
    restart: unless-stopped

    # Health check
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Resource limits (optional)
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

    # Volumes (relative to root directory)
    volumes:
      - ../logs:/app/logs
      - ../src:/app/src # Mount source code for development
      # Mount the entire secrets directory to avoid "Is a directory" errors
      - ../secrets:/app/secrets:ro

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Network
    networks:
      - gungong-network

  # ngrok - Expose bot to internet
  ngrok:
    image: ngrok/ngrok:latest
    container_name: gungong-ngrok
    restart: unless-stopped
    command:
      - "http"
      - "gungong-bot:8000"
    ports:
      - "4040:4040" # ngrok web UI for tunnel inspection
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    env_file:
      - ../.env.yaml
    networks:
      - gungong-network
    depends_on:
      - gungong-bot

networks:
  gungong-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
